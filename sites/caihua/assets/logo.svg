<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 132" role="img" aria-label="採話所 — 臺灣口承文藝採集會">
  <rect width="560" height="132" fill="#6E1B3C"/>
  <!-- 話帶：五枚母題記號 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 66h240" stroke="#F4E7C9" stroke-width="2" opacity=".45"/>
    <!-- 1 人（準備） -->
    <g transform="translate(20,22) scale(.62)" stroke="#F4E7C9" stroke-width="7">
      <rect x="0" y="0" width="100" height="120" fill="none" stroke="#F4E7C9" stroke-width="4" opacity=".5"/>
      <circle cx="50" cy="30" r="13"/><path d="M50 43v41M28 58h44M50 84 34 110M50 84 66 110"/>
    </g>
    <!-- 2 門（違反） -->
    <g transform="translate(80,22) scale(.62)">
      <rect x="0" y="0" width="100" height="120" fill="#FF7A1F" stroke="none"/>
      <g stroke="#1A0F16" stroke-width="7"><path d="M28 22h44v88H28zM28 68h44"/></g>
      <circle cx="63" cy="68" r="4" fill="#1A0F16"/>
    </g>
    <!-- 3 虎（對抗） -->
    <g transform="translate(140,22) scale(.62)">
      <rect x="0" y="0" width="100" height="120" fill="#3BD1C4" stroke="none"/>
      <g stroke="#1A0F16" stroke-width="7"><path d="M26 46v40h48V46zM26 46 19 26 38 42M74 46 81 26 62 42M36 74h28"/></g>
      <circle cx="40" cy="60" r="4" fill="#1A0F16"/><circle cx="60" cy="60" r="4" fill="#1A0F16"/>
    </g>
    <!-- 4 樹（解決） -->
    <g transform="translate(200,22) scale(.62)">
      <rect x="0" y="0" width="100" height="120" fill="#F4E7C9" stroke="none"/>
      <g stroke="#6E1B3C" stroke-width="7"><path d="M50 110V52M50 52 26 26M50 52 74 26M50 72 30 52M50 72 70 52"/></g>
    </g>
  </g>
  <text x="280" y="62" font-family="'Noto Serif TC',serif" font-weight="900" font-size="46" letter-spacing="8" fill="#F4E7C9">採話所</text>
  <text x="282" y="92" font-family="'Space Mono',monospace" font-size="15" letter-spacing="2.4" fill="#FF7A1F">KOU-SHOU FIELDWORK</text>
  <text x="282" y="112" font-family="'Noto Sans TC',sans-serif" font-size="13" letter-spacing="1.5" fill="#D8C7A2">臺灣口承文藝採集會</text>
</svg>
