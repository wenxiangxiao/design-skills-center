<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="南汐航路標識管理站站徽：燈質環包圍紅白條紋塔">
  <rect width="240" height="240" fill="#101C26"/>
  <!-- 燈質環：白瀨 Fl(2) W 10s，週期 10s 映射 360 度 -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#26394A" stroke-width="14"/>
  <!-- 閃 1：0–0.8s → -90° 起 28.8° -->
  <path d="M120 32 A88 88 0 0 1 160.85 42.02" fill="none" stroke="#FFD75C" stroke-width="14"/>
  <!-- 閃 2：1.6–2.4s → -32.4° 起 28.8° -->
  <path d="M194.3 71.6 A88 88 0 0 1 207.06 109.5" fill="none" stroke="#FFD75C" stroke-width="14"/>
  <!-- 秒刻 -->
  <g stroke="#5E7688" stroke-width="2">
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(36 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(72 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(108 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(144 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(180 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(216 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(252 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(288 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94" transform="rotate(324 120 120)"/>
    <line x1="120" y1="102" x2="120" y2="94"/>
  </g>
  <!-- 塔：紅白橫帶 -->
  <rect x="102" y="96" width="36" height="12" fill="#F4EEE1"/>
  <rect x="102" y="108" width="36" height="12" fill="#C7331B"/>
  <rect x="102" y="120" width="36" height="12" fill="#F4EEE1"/>
  <rect x="102" y="132" width="36" height="12" fill="#C7331B"/>
  <rect x="96" y="144" width="48" height="8" fill="#F4EEE1"/>
  <rect x="106" y="84" width="28" height="12" fill="#F4EEE1"/>
  <circle cx="120" cy="76" r="8" fill="#FFD75C"/>
</svg>
