<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="元聲 發聲與正音教室">
  <!-- 母音四邊形徽記：梯形＝元音圖，實心點＝一個母音位置，曲線＝矢狀舌位 -->
  <rect x="2" y="2" width="116" height="116" fill="#DE4E2A"/>
  <!-- 元音四邊形（梯形，前寬後窄、上寬下窄） -->
  <polygon points="24,26 96,26 82,92 40,92" fill="none" stroke="#201410" stroke-width="4" stroke-linejoin="round"/>
  <!-- 內部高低分隔線 -->
  <line x1="27" y1="48" x2="93" y2="48" stroke="#201410" stroke-width="1.6" opacity=".5"/>
  <line x1="31" y1="70" x2="88" y2="70" stroke="#201410" stroke-width="1.6" opacity=".5"/>
  <!-- 矢狀舌位曲線（骨白） -->
  <path d="M30 84 Q46 40 78 34" fill="none" stroke="#F3E7D0" stroke-width="4" stroke-linecap="round"/>
  <!-- /i/ 高前母音點（teal 為發音作用色） -->
  <circle cx="34" cy="30" r="8" fill="#1F8A82" stroke="#201410" stroke-width="3"/>
  <!-- 現用/焦點指示（mustard） -->
  <circle cx="86" cy="88" r="4.5" fill="#E9B23A" stroke="#201410" stroke-width="2"/>
</svg>
