<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" role="img" aria-label="清潭市民泳池 Chingtan Municipal Pool">
  <title>清潭市民泳池 Chingtan Municipal Pool</title>
  <rect width="300" height="120" fill="#EFECE2"/>
  <!-- 四階規線族：0.5 / 2 / 6 / 14 -->
  <rect x="0" y="10" width="300" height="1" fill="#111114"/>
  <rect x="0" y="20" width="300" height="2" fill="#111114"/>
  <rect x="0" y="32" width="300" height="6" fill="#111114"/>
  <!-- 兩塊專色與它們的疊印 -->
  <rect x="0" y="52" width="188" height="34" fill="#00A0E4"/>
  <g style="mix-blend-mode:multiply"><rect x="132" y="52" width="168" height="34" fill="#FFC400"/></g>
  <!-- 反白挖字：字從實色塊裡挖出來 -->
  <text x="8" y="79" font-family="Archivo,Helvetica,Arial,sans-serif" font-weight="900" font-size="27" letter-spacing="1" fill="#EFECE2">CHINGTAN</text>
  <text x="196" y="79" font-family="Archivo,Helvetica,Arial,sans-serif" font-weight="900" font-size="19" letter-spacing="2" fill="#111114">POOL</text>
  <!-- 粗規線穿過字 -->
  <rect x="0" y="72" width="300" height="4" fill="#00A0E4" style="mix-blend-mode:multiply"/>
  <rect x="0" y="98" width="300" height="14" fill="#111114"/>
  <text x="8" y="46" font-family="Archivo,Helvetica,Arial,sans-serif" font-weight="700" font-size="9" letter-spacing="5.4" fill="#111114">50m · 8 LANES · MUNICIPAL</text>
</svg>
