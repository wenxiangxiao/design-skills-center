<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="t d">
<title id="t">雙面社 SIANG-BIN</title>
<desc id="d">一只米黃色注塑卡帶殼，殼上兩個盤：左邊的盤小、右邊的盤大——帶已經放掉一半，收帶盤越捲越粗。殼底下一條琥珀色的帶位線。</desc>
<defs><filter id="mould" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.74 0.74" numOctaves="1" seed="476" result="n"/>
<feColorMatrix in="n" type="matrix" values=".34 .34 .34 0 0 .34 .34 .34 0 0 .34 .34 .34 0 0 0 0 0 0 1" result="h"/>
<feConvolveMatrix in="h" order="3" kernelMatrix="-2 -1 0 -1 1 1 0 1 2" divisor="1" preserveAlpha="true" result="e"/>
<feColorMatrix in="e" type="matrix" values=".30 0 0 0 .79 0 .30 0 0 .79 0 0 .30 0 .79 0 0 0 0 1" result="g"/>
<feComposite in="g" in2="SourceGraphic" operator="in" result="grain"/>
<feBlend in="SourceGraphic" in2="grain" mode="multiply"/></filter></defs>
<rect x="4" y="16" width="112" height="88" rx="9" fill="#D8CDB5" filter="url(#mould)"/>
