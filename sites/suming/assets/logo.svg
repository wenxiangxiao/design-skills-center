<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="速鳴速錄所 標誌">
  <!-- 和弦速錄譜 logo：迷你鍵格＋被壓下的和弦鍵＋譜線與符頭 -->
  <rect x="4" y="4" width="112" height="112" rx="10" fill="#3B1F42"/>
  <!-- 譜線（ledger lines） -->
  <g stroke="#E7DCC6" stroke-width="1.4" opacity="0.5">
    <line x1="16" y1="34" x2="104" y2="34"/>
    <line x1="16" y1="86" x2="104" y2="86"/>
  </g>
  <!-- 3x3 鍵格 -->
  <g>
    <!-- 未按鍵：骨白描邊空格 -->
    <g fill="none" stroke="#E7DCC6" stroke-width="2.2">
      <rect x="20" y="42" width="24" height="24" rx="4"/>
      <rect x="48" y="42" width="24" height="24" rx="4"/>
      <rect x="76" y="42" width="24" height="24" rx="4"/>
      <rect x="20" y="70" width="24" height="24" rx="4"/>
      <rect x="76" y="70" width="24" height="24" rx="4"/>
    </g>
    <!-- 按下的和弦鍵：黃銅實心＋下沉，組成一個「音」 -->
    <g>
      <rect x="20" y="16" width="24" height="20" rx="4" fill="#C99A3E"/>
      <rect x="76" y="16" width="24" height="20" rx="4" fill="#C99A3E"/>
      <rect x="48" y="70" width="24" height="24" rx="4" fill="#C99A3E"/>
    </g>
  </g>
  <!-- 符頭：ribbon-red，落在下譜線上 -->
  <circle cx="60" cy="86" r="8" fill="#D4402F"/>
  <rect x="66.5" y="52" width="2.6" height="34" fill="#D4402F"/>
</svg>
