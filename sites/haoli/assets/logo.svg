  <text x="62" y="58" font-size="10" font-family="monospace" font-weight="bold" fill="#1B1D22">417</text>
  <!-- 判讀標線：軀幹前緣 -->
  <rect x="86" y="14" width="2" height="96" fill="#E2442C"/>
  <text x="91" y="106" font-size="9" font-family="monospace" fill="#E2442C">10.874</text>
  <!-- 字標 -->
  <text x="176" y="52" font-size="34" font-family="'Noto Sans TC',sans-serif" font-weight="900" fill="#EFEAE0" letter-spacing="6">毫釐</text>
  <text x="176" y="76" font-size="15" font-family="'Noto Sans TC',sans-serif" font-weight="700" fill="#8A93A0" letter-spacing="3">終點判讀所</text>
  <text x="176" y="96" font-size="8.5" font-family="monospace" fill="#C99B4A" letter-spacing="1">HO-LI PHOTO-FINISH BUREAU</text>
