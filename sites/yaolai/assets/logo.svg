<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-label="搖籟八音社 Yaolai Music-Box Atelier">
  <title>搖籟八音社 Yaolai Music-Box Atelier</title>
  <!-- 一段打孔紙帶 + 黃銅音梳，孔位拼出一段上行小旋律 -->
  <g>
    <rect x="8" y="20" width="200" height="80" rx="10" fill="#EADFC7" stroke="#33294A" stroke-width="3"/>
    <rect x="8" y="20" width="200" height="10" fill="#DCCFB0"/>
    <rect x="8" y="90" width="200" height="10" fill="#DCCFB0"/>
    <!-- 音梳（左緣黃銅，齒下長上短） -->
    <rect x="16" y="30" width="9" height="60" fill="#B6873A" stroke="#33294A" stroke-width="1.5"/>
    <g fill="#D6A94E" stroke="#33294A" stroke-width="1.2">
      <rect x="25" y="35" width="20" height="4.5" rx="2"/>
      <rect x="25" y="45" width="30" height="4.5" rx="2"/>
      <rect x="25" y="55" width="40" height="4.5" rx="2"/>
      <rect x="25" y="65" width="52" height="4.5" rx="2"/>
      <rect x="25" y="75" width="64" height="4.5" rx="2"/>
    </g>
    <!-- 打穿的孔（音） -->
    <g>
      <circle cx="108" cy="78" r="6.5" fill="#C8B790"/><circle cx="108" cy="78" r="5" fill="#33294A"/>
      <circle cx="132" cy="66" r="6.5" fill="#C8B790"/><circle cx="132" cy="66" r="5" fill="#33294A"/>
      <circle cx="156" cy="54" r="6.5" fill="#C8B790"/><circle cx="156" cy="54" r="5" fill="#EE6D7A"/>
      <circle cx="180" cy="44" r="6.5" fill="#C8B790"/><circle cx="180" cy="44" r="5" fill="#33294A"/>
    </g>
  </g>
  <!-- 手柄 -->
  <g>
    <circle cx="224" cy="60" r="15" fill="#B27C4C" stroke="#33294A" stroke-width="3"/>
    <line x1="224" y1="60" x2="224" y2="47" stroke="#33294A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="224" cy="47" r="4.5" fill="#D6A94E" stroke="#33294A" stroke-width="2"/>
    <circle cx="224" cy="60" r="2.4" fill="#33294A"/>
  </g>
  <!-- 字標 -->
  <text x="252" y="58" font-family="'Noto Serif TC',serif" font-weight="900" font-size="30" fill="#33294A">搖籟</text>
  <text x="252" y="86" font-family="'Comfortaa','Noto Sans TC',sans-serif" font-weight="700" font-size="12.5" letter-spacing="2.5" fill="#5A4C74">YAOLAI · 八音社</text>
</svg>
