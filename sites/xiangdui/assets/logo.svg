<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" role="img" aria-label="相對・編隊跳傘會">
  <title>相對・編隊跳傘會 RELATIVE WORK FS CLUB</title>
  <rect width="420" height="140" fill="#F0F1EE"/>
  <!-- 第二白（白上白）：被三邊切斷，只靠邊界被看見；與任何形皆不相接 -->
  <rect x="0" y="128" width="420" height="12" fill="#E1E4E0"/>
  <rect x="384" y="0" width="36" height="36" fill="#E1E4E0"/>
  <!-- 主重量 -->
  <rect x="18" y="30" width="80" height="80" fill="#121512" transform="rotate(-22.5 58 70)"/>
  <!-- 遞減衛星：長條、正圓、三角、朱紅小方（彼此永不相接） -->
  <rect x="118" y="62" width="72" height="10" fill="#121512" transform="rotate(-22.5 154 67)"/>
  <circle cx="212" cy="52" r="13" fill="#121512"/>
  <path d="M198 96 214 122 182 122Z" fill="#121512"/>
  <rect x="122" y="92" width="22" height="22" fill="#CE2B1F" transform="rotate(45 133 103)"/>
  <!-- 字標 -->
  <text x="244" y="66" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.5" fill="#121512">相對</text>
  <text x="244" y="92" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="3.4" fill="#24378F">RELATIVE WORK</text>
  <text x="244" y="108" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="3.4" fill="#6C716B">FS CLUB · CHAOZHOU</text>
</svg>
