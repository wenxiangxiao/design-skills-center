<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 112" width="320" height="112" role="img" aria-label="順昌修鞋鋪 SHUN-CHANG SHOE REPAIR">
<title>順昌修鞋鋪</title>
<desc>斜光浮雕：一塊銅牌上的鞋眼孔與四枚針孔，光的入射角十六度。</desc>
<defs>
 <filter id="rk" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="2.0" result="h"/>
  <feDiffuseLighting in="h" surfaceScale="8" diffuseConstant="1.02" lighting-color="#EDE9E0" result="d">
   <feDistantLight azimuth="208" elevation="16"/>
  </feDiffuseLighting>
  <feSpecularLighting in="h" surfaceScale="8" specularConstant="0.55" specularExponent="26" lighting-color="#FFFFFF" result="sp">
   <feDistantLight azimuth="208" elevation="16"/>
  </feSpecularLighting>
  <feComposite in="sp" in2="d" operator="arithmetic" k1="0" k2="1" k3="1" k4="-0.06"/>
 </filter>
</defs>
<rect width="320" height="112" fill="#1A1B1E"/>
<g filter="url(#rk)">
 <rect x="10" y="10" width="300" height="92" rx="3" fill="#fff"/>
 <circle cx="52" cy="56" r="24" fill="#000"/>
 <circle cx="52" cy="56" r="15.5" fill="#fff"/>
 <rect x="98" y="34" width="11" height="44" rx="2" fill="#000"/>
 <rect x="122" y="34" width="11" height="44" rx="2" fill="#000"/>
 <rect x="146" y="34" width="11" height="44" rx="2" fill="#000"/>
 <rect x="170" y="34" width="11" height="44" rx="2" fill="#000"/>
 <rect x="198" y="43" width="94" height="7" rx="3.5" fill="#000"/>
 <rect x="198" y="59" width="58" height="7" rx="3.5" fill="#000"/>
</g>
<text x="10" y="110" font-family="IBM Plex Mono, monospace" font-size="8" letter-spacing="2" fill="#585960">SHUN-CHANG SHOE REPAIR</text>
</svg>
