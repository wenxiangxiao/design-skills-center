<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-label="析光所 Xiguang Optical Theatre">
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A5CFF"/><stop offset=".2" stop-color="#3E7BFF"/>
      <stop offset=".4" stop-color="#46D66A"/><stop offset=".6" stop-color="#F2D24A"/>
      <stop offset=".8" stop-color="#FF9A3C"/><stop offset="1" stop-color="#FF4D4D"/>
    </linearGradient>
  </defs>
  <!-- incoming white ray -->
  <line x1="6" y1="36" x2="40" y2="36" stroke="#F6EFDF" stroke-width="2.4"/>
  <!-- prism -->
  <polygon points="42,52 66,20 66,52" fill="none" stroke="#E8E2D5" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="42,52 66,20 66,52" fill="#E8E2D5" opacity="0.06"/>
  <!-- dispersed spectrum fan -->
  <g stroke-width="2.1" fill="none" opacity="0.95">
    <line x1="66" y1="41" x2="150" y2="24" stroke="#7A5CFF"/>
    <line x1="66" y1="42" x2="150" y2="29" stroke="#3E7BFF"/>
    <line x1="66" y1="43" x2="150" y2="34" stroke="#46D66A"/>
    <line x1="66" y1="44" x2="150" y2="39" stroke="#F2D24A"/>
    <line x1="66" y1="45" x2="150" y2="44" stroke="#FF9A3C"/>
    <line x1="66" y1="46" x2="150" y2="49" stroke="#FF4D4D"/>
  </g>
  <text x="160" y="34" font-family="'Noto Serif TC',serif" font-weight="900" font-size="26" fill="#E8E2D5">析光所</text>
  <text x="160" y="52" font-family="'Space Mono',monospace" font-size="9.5" letter-spacing="1.5" fill="#9AA0A8">XIGUANG OPTICAL</text>
</svg>
