    <h1>認呼考</h1>
    <p>呼舞者要能一眼認出走位。左邊是一段舞者剛走過的<b>走位跡</b>，猜猜看，這是哪一個圖形？十題一輪，考完告訴你最容易看走眼的是哪兩式。</p>
  </div>

    <div class="card">
      <div class="hd"><span id="qnum">第 1 / 10 題</span><span id="streak" class="mono"></span></div>

        <canvas id="trace" width="600" height="600" aria-hidden="true"></canvas>
        <svg id="floorsvg" viewBox="0 0 400 400" role="img" aria-label="一段走位跡，請辨認圖形"><g id="floordeco"></g><g id="dancers"></g></svg>

    </div>

<script>
"use strict";
(function(){
  var N=8,CX=200,CY=200,R=140,TAU=Math.PI*2;
  var REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var HOME=[];for(var i=0;i<N;i++)HOME.push(i);
  function roleOf(d){return d%2===0?'A':'B';}
  function colOf(d){return d%2===0?'#C7402B':'#2E5A7A';}
  function slotAngle(s){return -Math.PI/2+s*(TAU/N);}
  function slotPos(s){var a=slotAngle(s);return{x:CX+R*Math.cos(a),y:CY+R*Math.sin(a),a:a};}
  function partnerSlot(s){return(s%2===0)?s+1:s-1;}
  function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  var FIGS=[
    {id:'in_out',zh:'進退',en:'IN & OUT',beats:8,style:'radial',apply:function(o){return o.slice();}},
    {id:'circle_l',zh:'大圈左行',en:'CIRCLE LEFT',beats:8,style:'ring',dir:1,span:2,apply:function(o){var n=new Array(N);for(var s=0;s<N;s++)n[(s+2)%N]=o[s];return n;}},
    {id:'circle_r',zh:'大圈右行',en:'CIRCLE RIGHT',beats:8,style:'ring',dir:-1,span:2,apply:function(o){var n=new Array(N);for(var s=0;s<N;s++)n[(s-2+N)%N]=o[s];return n;}},
    {id:'dosido',zh:'背對背',en:'DO-SI-DO',beats:8,style:'dosido',apply:function(o){return o.slice();}},
    {id:'allemande',zh:'右手勾轉',en:'ALLEMANDE R',beats:8,style:'allemande',apply:function(o){return o.slice();}},
    {id:'swap',zh:'對位互換',en:'PARTNER SWAP',beats:4,style:'swap',apply:function(o){var n=o.slice();for(var s=0;s<N;s+=2){var t=n[s];n[s]=n[s+1];n[s+1]=t;}return n;}},
    {id:'star',zh:'右手星',en:'RIGHT-HAND STAR',beats:8,style:'star',apply:function(o){return o.slice();}},
    {id:'chain',zh:'穿花大鏈',en:'GRAND CHAIN',beats:16,style:'chain',apply:function(o){return o.slice();}}
  ];
  var FMAP={};FIGS.forEach(function(f){FMAP[f.id]=f;});
  function pathOf(fig,d,fromSlot,toSlot,t){
    var pf=slotPos(fromSlot),pt=slotPos(toSlot);
    switch(fig.style){
      case 'radial':{var a=pf.a,rr=R*(1-0.30*Math.sin(Math.PI*t));return{x:CX+rr*Math.cos(a),y:CY+rr*Math.sin(a)};}
      case 'ring':{var a0=slotAngle(fromSlot),a1=a0+fig.dir*(TAU/N)*fig.span,aa=a0+(a1-a0)*ease(t);return{x:CX+R*Math.cos(aa),y:CY+R*Math.sin(aa)};}
      case 'dosido':{var ps=partnerSlot(fromSlot),pp=slotPos(ps),mx=(pf.x+pp.x)/2,my=(pf.y+pp.y)/2,rx=pf.x-mx,ry=pf.y-my,ang=(roleOf(d)==='A'?1:-1)*TAU*t,c=Math.cos(ang),s=Math.sin(ang),k=1+0.14*Math.sin(Math.PI*t);return{x:mx+(rx*c-ry*s)*k,y:my+(rx*s+ry*c)*k};}
      case 'allemande':{var ps2=partnerSlot(fromSlot),pp2=slotPos(ps2),mx2=(pf.x+pp2.x)/2,my2=(pf.y+pp2.y)/2,rx2=(pf.x-mx2)*0.82,ry2=(pf.y-my2)*0.82,ang2=TAU*t,c2=Math.cos(ang2),s2=Math.sin(ang2);return{x:mx2+(rx2*c2-ry2*s2),y:my2+(rx2*s2+ry2*c2)};}
      case 'swap':{var a0s=slotAngle(fromSlot),a1s=slotAngle(toSlot),da=a1s-a0s;if(da>Math.PI)da-=TAU;if(da<-Math.PI)da+=TAU;var aa2=a0s+da*ease(t),bulge=(roleOf(d)==='A'?1:-1)*26*Math.sin(Math.PI*t),rr2=R+bulge;return{x:CX+rr2*Math.cos(aa2),y:CY+rr2*Math.sin(aa2)};}
      case 'star':{var g=(fromSlot<4)?0:1,base=g*4,cx=0,cy=0;for(var q=0;q<4;q++){var p=slotPos(base+q);cx+=p.x;cy+=p.y;}cx/=4;cy/=4;var rx3=pf.x-cx,ry3=pf.y-cy,ang3=TAU*ease(t),c3=Math.cos(ang3),s3=Math.sin(ang3),k3=0.7+0.3*Math.cos(Math.PI*t);return{x:cx+(rx3*c3-ry3*s3)*k3,y:cy+(rx3*s3+ry3*c3)*k3};}
      case 'chain':{var dir=(roleOf(d)==='A'?1:-1),a0c=slotAngle(fromSlot),ac=a0c+dir*TAU*ease(t),weave=16*Math.sin(t*N*Math.PI)*dir,rr3=R+weave;return{x:CX+rr3*Math.cos(ac),y:CY+rr3*Math.sin(ac)};}
    }
    return{x:pf.x+(pt.x-pf.x)*t,y:pf.y+(pt.y-pf.y)*t};
  }

  // ---- floor ----
  var gD=document.getElementById('dancers'),gDeco=document.getElementById('floordeco');
  var canvas=document.getElementById('trace'),ctx=null;try{ctx=canvas.getContext('2d');}catch(e){ctx=null;}
  (function(){var s='<circle cx="200" cy="200" r="'+R+'" fill="none" stroke="#C79A46" stroke-width="1.4" stroke-dasharray="2 6"/><circle cx="200" cy="200" r="3" fill="#734625"/>';for(var j=0;j<N;j++){var p=slotPos(j);s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="14" fill="none" stroke="#C9A26A" stroke-width="1" stroke-dasharray="1.5 3.5"/>';}gDeco.innerHTML=s;})();
  var nodes=[];
  for(var d2=0;d2<N;d2++){var g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML='<circle r="12" fill="'+colOf(d2)+'"/><circle r="12" fill="none" stroke="#241A12" stroke-width="1.5"/><circle cy="-3" r="4" fill="#F0E4CE"/>';gD.appendChild(g);nodes[d2]=g;}
  function place(pos){for(var d=0;d<N;d++)nodes[d].setAttribute('transform','translate('+pos[d].x.toFixed(2)+','+pos[d].y.toFixed(2)+')');}
  function occPos(o){var pos=[];for(var s=0;s<N;s++)pos[o[s]]=slotPos(s);return pos;}
  function clearTrace(){if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height);}
  function traceDot(d,x,y,al){if(!ctx)return;ctx.beginPath();ctx.fillStyle=(d%2===0)?'rgba(199,64,43,'+al+')':'rgba(46,90,122,'+al+')';ctx.arc(x*1.5,y*1.5,1.5,0,TAU);ctx.fill();}
  // draw full static trace of a figure (reduced-motion / default question view)
  function drawStatic(fig){
    clearTrace();
    var o=HOME.slice(),target=fig.apply(o),fromSlot=[],toSlot=[];
    for(var s=0;s<N;s++){fromSlot[o[s]]=s;toSlot[target[s]]=s;}
    for(var d=0;d<N;d++){for(var k=0;k<=48;k++){var p=pathOf(fig,d,fromSlot[d],toSlot[d],k/48);traceDot(d,p.x,p.y,0.5);}}
    place(occPos(HOME));
  }
  var busy=false;
  function animate(fig,cb){
    if(busy){if(cb)cb();return;}busy=true;clearTrace();
    var o=HOME.slice(),target=fig.apply(o),fromSlot=[],toSlot=[];
    for(var s=0;s<N;s++){fromSlot[o[s]]=s;toSlot[target[s]]=s;}
    var dur=REDUCE?0:Math.max(700,fig.beats*95),t0=null;
    function frame(ts){if(t0===null)t0=ts;var t=dur===0?1:Math.min(1,(ts-t0)/dur);var pos=[];for(var dd=0;dd<N;dd++){var p=pathOf(fig,dd,fromSlot[dd],toSlot[dd],t);pos[dd]=p;traceDot(dd,p.x,p.y,0.55);}place(pos);if(t<1)requestAnimationFrame(frame);else{place(occPos(HOME));busy=false;if(cb)cb();}}
    requestAnimationFrame(frame);
  }

  // ---- quiz state ----
  var TOTAL=10;
  var qi=0,right=0,streak=0,bestStreak=0,answered=false,cur=null;
  var confusion={}; // "chosen>target" -> count
  var qnum=document.getElementById('qnum'),optsEl=document.getElementById('opts'),fb=document.getElementById('fb'),nextBtn=document.getElementById('next'),qtext=document.getElementById('qtext');
  var rightEl=document.getElementById('right'),runEl=document.getElementById('run'),streakEl=document.getElementById('streak'),panel=document.getElementById('panel');
  var replayBtn=document.getElementById('replay');

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function newQuestion(){
    answered=false;nextBtn.style.display='none';fb.textContent='';
    cur=FIGS[Math.floor(Math.random()*FIGS.length)];
    qnum.textContent='第 '+(qi+1)+' / '+TOTAL+' 題';
    // options: target + 3 distractors
    var others=FIGS.filter(function(f){return f.id!==cur.id;});
    shuffle(others);
    var opts=shuffle([cur].concat(others.slice(0,3)));
    optsEl.innerHTML='';
    opts.forEach(function(f){
      var b=document.createElement('button');
      b.innerHTML='<b>'+f.zh+'</b><span>'+f.en+'</span>';
      b.addEventListener('click',function(){answer(f,b);});
      optsEl.appendChild(b);
    });
    if(REDUCE){drawStatic(cur);} else {animate(cur);}
  }
  function answer(f,btn){
    if(answered)return;answered=true;
    var buttons=optsEl.querySelectorAll('button');
    Array.prototype.forEach.call(buttons,function(b){b.disabled=true;});
    if(f.id===cur.id){
      btn.className='correct';right++;streak++;bestStreak=Math.max(bestStreak,streak);
      fb.innerHTML='對了！這是 <b>'+cur.zh+'</b>（'+cur.en+'）。';
    }else{
      btn.className='wrong';streak=0;
      // mark the correct one
      Array.prototype.forEach.call(buttons,function(b){if(b.querySelector('b').textContent===cur.zh)b.className='correct';});
      var key=f.zh+'｜'+cur.zh;confusion[key]=(confusion[key]||0)+1;
      fb.innerHTML='這其實是 <b>'+cur.zh+'</b>。你看成了 '+f.zh+'——它們的走位跡確實有點像。';
    }
    rightEl.textContent=right;runEl.textContent=streak;streakEl.textContent=streak>=3?('連對 '+streak+' 手不斷'):'';
    qi++;
    nextBtn.style.display='inline-block';
    nextBtn.textContent = qi>=TOTAL ? '看成績 →' : '下一題 →';
  }
  nextBtn.addEventListener('click',function(){if(qi>=TOTAL)showResult();else newQuestion();});
  replayBtn.addEventListener('click',function(){if(cur)animate(cur);});

  function showResult(){
    var grade,word;
    if(right>=10){grade='甲上';word='一眼認圖，可以上台呼了。';}
    else if(right>=8){grade='甲';word='很穩，偶爾看走眼。';}
    else if(right>=6){grade='乙';word='圖形大致認得，再多跳幾次。';}
    else{grade='丙';word='先回舞碼館把八式走位跡看熟。';}
    // most confused
    var worst=null,wc=0;
    for(var k in confusion){if(confusion[k]>wc){wc=confusion[k];worst=k;}}
    var advice;
    if(!worst){advice='你這輪沒有明顯混淆的組合，穩定度很高。想再拚滿分，挑戰把十題全對。';}
    else{
      var pair=worst.split('｜'); // chosen ｜ target
      advice='你最常把 <b>'+pair[1]+'</b> 看成 <b>'+pair[0]+'</b>（'+wc+' 次）。訣竅：'+tipFor(pair[1],pair[0])+'';
    }
    panel.innerHTML='<div class="result"><div class="grade">'+grade+'</div>'+
      '<h2>十題答對 '+right+' 題</h2>'+
      '<p style="margin:2px 0 0;color:var(--ground2)">'+word+'　最長連對 '+bestStreak+' 題。</p>'+
      '<div class="advice">個人化建議：'+advice+'</div>'+
      '<button class="next" id="again">再考一輪</button> '+
      '<a class="next" style="text-decoration:none;background:var(--cream2);color:var(--ink)" href="wumu.html">去舞碼館複習</a></div>';
    document.getElementById('again').addEventListener('click',function(){qi=0;right=0;streak=0;bestStreak=0;confusion={};rebuildPanel();newQuestion();});
    qnum.textContent='考完了';streakEl.textContent='';
  }
  function tipFor(target,chosen){
    var m={
      '大圈左行':'看整圈是往左（逆時針）掃還是往右。',
      '大圈右行':'看整圈是往右（順時針）掃還是往左。',
      '背對背':'背對背是繞小圈、人不換位；勾轉的弧線更緊。',
      '右手勾轉':'勾轉兩人繞同一圓心、弧線抱得緊；背對背繞得開。',
      '對位互換':'互換是兩人真的交換了位置，跡呈交叉；別的雙人圖形會回原位。',
      '右手星':'星是四人繞一個小中心；穿花是全體繞大圈。',
      '穿花大鏈':'大鏈是紅藍反向繞整個大圈、互相穿過；星只在四人小圈裡。',
      '進退':'進退是直直進出圓心的放射線，沒有繞行。'
    };
    return m[target]||'多看幾次它的走位跡就記住了。';
  }
  function rebuildPanel(){
    panel.innerHTML='<div class="q" id="qtext">這段走位是哪個圖形？</div><div class="opts" id="opts"></div><div class="fb" id="fb" aria-live="polite"></div><button class="next" id="next" style="display:none">下一題 →</button><div class="scorebar"><span>答對 <b id="right">0</b></span><span>連對 <b id="run">0</b></span></div>';
    optsEl=document.getElementById('opts');fb=document.getElementById('fb');nextBtn=document.getElementById('next');rightEl=document.getElementById('right');runEl=document.getElementById('run');
    nextBtn.addEventListener('click',function(){if(qi>=TOTAL)showResult();else newQuestion();});
  }

  newQuestion();
})();
</script>
