<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="曼真照相館 MAN CHAN PHOTO STUDIO">
<title>曼真照相館</title>
<defs>
<linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F6E9BE"/><stop offset=".38" stop-color="#D9B75E"/>
<stop offset=".52" stop-color="#8A6A22"/><stop offset=".72" stop-color="#E3C778"/><stop offset="1" stop-color="#8F6F27"/></linearGradient>
<radialGradient id="ch" cx=".34" cy=".28" r=".86">
<stop offset="0" stop-color="#FAF3E6"/><stop offset=".55" stop-color="#FAF3E6" stop-opacity=".5"/><stop offset="1" stop-color="#4A3E36"/></radialGradient>
<filter id="lg" x="-6%" y="-6%" width="112%" height="112%">
<feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="17" result="n"/>
<feColorMatrix in="n" type="saturate" values="0" result="ns"/>
<feComponentTransfer in="ns" result="na"><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
<feComposite in="na" in2="SourceGraphic" operator="in" result="grit"/>
<feBlend in="SourceGraphic" in2="grit" mode="multiply"/></filter>
</defs>
<rect width="320" height="120" fill="#F1E4CE"/>
<rect x="0" y="0" width="320" height="9" fill="url(#brass)"/>
<rect x="0" y="111" width="320" height="9" fill="url(#brass)"/>
<circle cx="122" cy="60" r="8" fill="none" stroke="#A8842E" stroke-width="3"/>
<circle cx="198" cy="60" r="8" fill="none" stroke="#A8842E" stroke-width="3"/>
<g filter="url(#lg)"><circle cx="60" cy="60" r="34" fill="url(#ch)"/></g>
<g style="mix-blend-mode:multiply"><circle cx="60" cy="60" r="34" fill="#C2465E" opacity=".6"/>
<circle cx="60" cy="60" r="34" fill="none" stroke="#782B3A" stroke-width="1.7" opacity=".55"/></g>
<text x="232" y="52" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="30" letter-spacing="3" fill="#2B2320">曼真</text>
<text x="232" y="80" text-anchor="middle" font-family="Bodoni Moda,serif" font-size="10.5" letter-spacing="2.4" fill="#6B5A50">MAN CHAN</text>
<rect x="106" y="94" width="212" height="1.6" fill="#2B2320" opacity=".55"/>
</svg>
