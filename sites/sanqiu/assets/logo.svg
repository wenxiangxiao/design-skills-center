<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img" aria-label="三球雜耍研究所 SANQIU Juggling Lab">
  <!-- 拋物運動風 logo：三顆球沿一條 siteswap 拋物線的落點；全原創幾何，無外部圖像 -->
  <rect width="240" height="96" fill="none"/>
  <!-- 兩隻手（基線上的托台） -->
  <rect x="14" y="74" width="30" height="8" fill="#16130E"/>
  <rect x="196" y="74" width="30" height="8" fill="#16130E"/>
  <!-- 三條交錯的拋物線（cascade） -->
  <path d="M29 74 Q80 6 211 74" fill="none" stroke="#1E44C8" stroke-width="4" stroke-linecap="round"/>
  <path d="M211 74 Q160 14 90 74" fill="none" stroke="#EF3B1C" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M120 74 Q150 30 176 74" fill="none" stroke="#16130E" stroke-width="3" stroke-linecap="round" opacity="0.55" stroke-dasharray="2 6"/>
  <!-- 三顆球 -->
  <circle cx="70" cy="30" r="11" fill="#FFC400" stroke="#16130E" stroke-width="3"/>
  <circle cx="150" cy="24" r="11" fill="#EF3B1C" stroke="#16130E" stroke-width="3"/>
  <circle cx="120" cy="52" r="9" fill="#1E44C8" stroke="#16130E" stroke-width="3"/>
  <!-- 節奏數字 3 -->
  <text x="120" y="92" text-anchor="middle" font-family="'Space Mono',monospace" font-size="13" font-weight="700" fill="#16130E" letter-spacing="2">5 3 1</text>
</svg>
