<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="240" height="96" role="img" aria-label="Scholes Flying Club — THE HOMER">
  <title>Scholes Flying Club — THE HOMER</title>
  <defs>
    <!-- 85 lpi 單色網點，45 度：兩層相同格陣互錯半格 -->
    <pattern id="lg-s40" width="6.4" height="6.4" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.61" fill="#17171A"/>
      <circle cx="4.8" cy="4.8" r="1.61" fill="#17171A"/>
    </pattern>
    <pattern id="lg-s25" width="6.4" height="6.4" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.28" fill="#17171A"/>
      <circle cx="4.8" cy="4.8" r="1.28" fill="#17171A"/>
    </pattern>
  </defs>

  <!-- 紅頂：報頭一律是一塊出血的紅，不是線也不是字 -->
  <rect x="0" y="0" width="240" height="96" fill="#B80014"/>

  <!-- 反白＝紙色，全圖沒有一處純白 -->
  <g fill="#D6D4C6">
    <!-- 鴿：沒有輪廓線，形由色域邊界決定 -->
    <path d="M52 40 Q52 25 68 24 Q84 23 88 36 L104 40 Q132 42 148 54 Q166 68 160 80 L96 80 Q70 78 60 66 Q52 56 52 40 Z"/>
    <path d="M52 40 L30 46 L54 52 Z"/>
    <path d="M104 78 L104 88 L98 88 L98 90 L112 90 L112 88 L108 88 L108 78 Z"/>
  </g>
  <!-- 眼：紙色圈中一點墨 -->
  <circle cx="70" cy="37" r="3.4" fill="#17171A"/>
  <!-- 翼：兩階網點，疊在鴿身上，深淺數得出來 -->
  <path d="M96 44 Q124 46 144 58 Q156 66 152 74 L108 74 Q92 64 96 44 Z" fill="url(#lg-s40)"/>
  <path d="M100 48 Q120 50 134 58 L126 66 Q106 62 100 48 Z" fill="url(#lg-s25)"/>

  <!-- 環：墨色實塊上挖出紙色號碼位 -->
  <rect x="98" y="80" width="14" height="5" fill="#17171A"/>
  <rect x="100" y="81.4" width="2" height="2.2" fill="#D6D4C6"/>
  <rect x="104" y="81.4" width="2" height="2.2" fill="#D6D4C6"/>
  <rect x="108" y="81.4" width="2" height="2.2" fill="#D6D4C6"/>

  <!-- 刊名：長體反白，兩端頂到欄寬（見方） -->
  <text x="168" y="44" text-anchor="middle" fill="#D6D4C6"
        font-family="Archivo, 'Arial Narrow', Helvetica, sans-serif"
        font-size="30" font-weight="900" letter-spacing="-0.5"
        transform="scale(0.78 1)" transform-origin="168 44"
        style="font-variation-settings:'wdth' 62,'wght' 900">THE HOMER</text>
  <!-- 2.4px 框線是本風格僅有的兩種線寬之一 -->
  <rect x="152" y="54" width="80" height="2.4" fill="#D6D4C6"/>
  <text x="168" y="72" text-anchor="middle" fill="#D6D4C6"
        font-family="Archivo, 'Arial Narrow', Helvetica, sans-serif"
        font-size="11" font-weight="700" letter-spacing="1.6">SCHOLES F.C. 1921</text>
</svg>
