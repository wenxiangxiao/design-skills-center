<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96" role="img" aria-label="榕蔭堂中醫 本草曆">
  <defs>
    <clipPath id="bowlClip"><path d="M14 52 h56 a28 22 0 0 1 -56 0 z"/></clipPath>
  </defs>
  <!-- 印章式外框 seal frame -->
  <rect x="2.5" y="2.5" width="83" height="91" rx="5" fill="none" stroke="#B23A26" stroke-width="3"/>
  <!-- 缽 mortar bowl -->
  <path d="M14 52 h56 a28 22 0 0 1 -56 0 z" fill="#3B5B45"/>
  <path d="M12 50 h60" stroke="#211C17" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 缽內細點（點描呼應） -->
  <g clip-path="url(#bowlClip)" fill="#EFE7D3" opacity="0.55">
    <circle cx="26" cy="58" r="1"/><circle cx="34" cy="62" r="1"/><circle cx="44" cy="60" r="1"/>
    <circle cx="52" cy="63" r="1"/><circle cx="60" cy="58" r="1"/><circle cx="39" cy="66" r="1"/>
    <circle cx="49" cy="57" r="1"/><circle cx="30" cy="64" r="1"/><circle cx="56" cy="61" r="1"/>
  </g>
  <!-- 杵 pestle -->
  <rect x="46" y="10" width="7" height="34" rx="3.2" transform="rotate(20 49 27)" fill="#8A5A2B" stroke="#211C17" stroke-width="1.4"/>
  <!-- 一片榕葉 leaf -->
  <path d="M18 26 C24 14 40 12 46 16 C40 30 26 34 18 30 Z" fill="#3B5B45"/>
  <path d="M20 28 C28 24 38 20 45 16" fill="none" stroke="#EFE7D3" stroke-width="1.3"/>
  <!-- 字標 wordmark -->
  <text x="104" y="44" font-family="'Noto Serif TC',serif" font-weight="900" font-size="34" fill="#211C17" letter-spacing="2">榕蔭堂</text>
  <text x="104" y="72" font-family="'Noto Serif TC',serif" font-weight="700" font-size="17" fill="#3B5B45" letter-spacing="6">中醫 · 本草曆</text>
  <text x="106" y="90" font-family="Georgia,serif" font-style="italic" font-size="10" fill="#8A5A2B" letter-spacing="2">RONGYINTANG · HERBAL ALMANAC</text>
</svg>
