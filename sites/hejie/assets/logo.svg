<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" role="img" aria-label="河界棋院 Héjiè Xiangqi Academy">
  <!-- a red 帥 disc and a black 將 disc facing across the 河界, the wordmark to the right -->
  <g>
    <circle cx="26" cy="30" r="22" fill="#EDE1C8" stroke="#D0402E" stroke-width="3"/>
    <circle cx="26" cy="30" r="17.5" fill="none" stroke="#D0402E" stroke-width="1.2"/>
    <text x="26" y="38.5" font-family="Noto Serif TC, serif" font-size="25" font-weight="900" text-anchor="middle" fill="#D0402E">帥</text>
    <circle cx="66" cy="42" r="22" fill="#EDE1C8" stroke="#1A1512" stroke-width="3"/>
    <circle cx="66" cy="42" r="17.5" fill="none" stroke="#1A1512" stroke-width="1.2"/>
    <text x="66" y="50.5" font-family="Noto Serif TC, serif" font-size="25" font-weight="900" text-anchor="middle" fill="#1A1512">將</text>
    <!-- 河界 hint: a thin gold band between -->
    <line x1="46" y1="12" x2="46" y2="60" stroke="#D8A63C" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/>
  </g>
  <g font-family="Noto Serif TC, serif" fill="#1E2C3E">
    <text x="104" y="34" font-size="27" font-weight="900" letter-spacing="3">河界棋院</text>
    <text x="105" y="52" font-family="Kode Mono, monospace" font-size="10.5" letter-spacing="3" fill="#8a7f66">HÉJIÈ XIANGQI ACADEMY</text>
  </g>
</svg>
