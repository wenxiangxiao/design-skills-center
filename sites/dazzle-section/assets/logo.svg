  <polygon points="132,96 150,102 138,110 152,116 132,118" fill="#0E0F12"/>
  <text x="136" y="42" font-family="'Archivo Black',Impact,sans-serif" font-size="30" letter-spacing="1.6" fill="#0E0F12">THE DAZZLE</text>
  <text x="136" y="72" font-family="'Archivo Black',Impact,sans-serif" font-size="30" letter-spacing="1.6" fill="#BE3A52">SECTION</text>
  <text x="160" y="112" font-family="'Archivo Black',Impact,sans-serif" font-size="11" letter-spacing="2.4" fill="#0E0F12">BIRKENHEAD · NO.4 GRAVING DOCK</text>
  <rect x="136" y="82" width="200" height="4" fill="#0E0F12"/>
</svg>
