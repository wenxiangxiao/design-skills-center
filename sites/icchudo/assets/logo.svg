<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 104" width="280" height="104" role="img" aria-label="一炷堂 ICCHŪDŌ">
  <rect width="280" height="104" fill="#11161A"/>
  <!-- 香紋：甲乙甲丙乙（右起五炉，同味者上端相連） -->
  <g stroke="#CFC9BB" stroke-width="3" stroke-linecap="square" fill="none">
    <line x1="86" y1="38" x2="86" y2="84"/>
    <line x1="70" y1="30" x2="70" y2="84"/>
    <line x1="54" y1="38" x2="54" y2="84"/>
    <line x1="38" y1="46" x2="38" y2="84"/>
    <line x1="22" y1="30" x2="22" y2="84"/>
    <line x1="86" y1="38" x2="54" y2="38"/>
    <line x1="70" y1="30" x2="22" y2="30"/>
  </g>
  <!-- 炭火 -->
  <circle cx="54" cy="16" r="3.4" fill="#E2703A"/>
  <!-- 灰筋 -->
  <g stroke="#8D9598" stroke-width="1" opacity=".55">
    <line x1="22" y1="92" x2="86" y2="92"/>
  </g>
  <text x="118" y="52" fill="#CFC9BB" font-family="'Shippori Mincho','Noto Serif TC',serif" font-size="34" font-weight="700" letter-spacing="6">一炷堂</text>
  <text x="119" y="76" fill="#8D9598" font-family="'DM Mono',ui-monospace,monospace" font-size="10" letter-spacing="5.4">ICCHŪDŌ · KŌDŌ</text>
  <line x1="118" y1="62" x2="262" y2="62" stroke="#8C3243" stroke-width="1.6"/>
</svg>
