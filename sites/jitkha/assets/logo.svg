<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="日頭跤寫生會：一筆載滿顏料的橫拖，右端沒顏料了">
  <title>日頭跤寫生會</title>
  <rect width="120" height="120" fill="#9C8F79"/>
  <g>
    <!-- 日頭：一刀壓出來的黃，不是一個圓 -->
    <path d="M22 26c11-9 26-9 34-1 6.6 6.6 6 17-1.4 23.4-9.6-3.6-20.6-4.6-31.6-3.2z" fill="#E4A81C"/>
    <path d="M22 25.4c11-9 26-9 34-1l-1.6 3.2c-8-7-21.6-7-31.4.8z" fill="#F1EBDD" opacity=".85"/>
  </g>
  <!-- 主筆：載滿 → 中段實 → 右端飛白 -->
  <path d="M8 74c16-7.6 31-10.4 45-9.2 8 .7 14.4 2.3 20 4.6l-2.6 15.6C64.8 82.6 58 81 50 80.2 37 79 23 80.8 9.4 86z" fill="#C33A22"/>
  <path d="M8 73.2c16-7.6 31-10.4 45-9.2 8 .7 14.4 2.3 20 4.6l-1 6C65.6 71.6 59 70 51 69.2 38 68 24 69.8 9.6 75.2z" fill="#F1EBDD" opacity=".9"/>
  <!-- 右端：顏料用完了，只剩布的凸起沾得到 -->
  <g fill="#C33A22">
    <path d="M75 70.4c5 .9 9 2.2 12.4 3.6l-2 12.4c-3.6-1.8-7.4-3.2-11.8-4.2z"/>
    <path d="M91 75.8c3 1.4 5.6 2.9 8 4.4l-1.8 11c-2.4-1.8-5-3.4-8-4.8z"/>
    <path d="M103 82.4c2.4 1.7 4.6 3.5 6.6 5.4l-1.6 9.6c-2-2.1-4.2-4-6.6-5.8z"/>
    <path d="M85.6 89.6c2.6 1 5 2.2 7.2 3.4l-1 6c-2.2-1.3-4.6-2.5-7.2-3.5z"/>
  </g>
  <path d="M75 69.6c5 .9 9 2.2 12.4 3.6l-.7 4.4c-3.4-1.5-7.2-2.7-11.9-3.6z" fill="#F1EBDD" opacity=".75"/>
  <!-- 底漆從沒畫到的地方露出來（這一塊刻意不上色） -->
  <path d="M96 42l16 6-4 13-15-5z" fill="#2B4A86"/>
  <path d="M96 41.4l16 6-1 3.4-15.6-5.8z" fill="#F1EBDD" opacity=".7"/>
</svg>
