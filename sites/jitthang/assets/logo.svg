<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="日窗回收社">
  <title>日窗回收社</title>
  <desc>型版標記：一個「日」字被刻成型版，中間兩塊會掉下來的島各以一根紙橋接回外界。</desc>
  <rect width="320" height="96" fill="#B9AB8D"/>
  <!-- 朱版：底 -->
  <rect x="6" y="6" width="84" height="84" fill="#C6261A"/>
  <!-- 墨版：「日」的型版形，butt 端、miter 角、零圓角 -->
  <g fill="none" stroke="#191510" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M20 20H76V76H20Z"/>
    <path d="M20 48H76"/>
  </g>
  <!-- 紙橋：把上下兩座島接回外界（沒有它們，中間兩塊紙會掉下來） -->
  <g fill="#C6261A">
    <rect x="40" y="14" width="16" height="12"/>
    <rect x="40" y="42" width="16" height="12"/>
    <rect x="40" y="70" width="16" height="12"/>
    <rect x="14" y="40" width="12" height="16"/>
  </g>
  <!-- 字標 -->
  <text x="104" y="52" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        font-size="34" font-weight="900" letter-spacing="6" fill="#191510">日窗回收社</text>
  <text x="106" y="74" font-family="'Stardos Stencil',monospace" font-size="12"
        letter-spacing="3.4" fill="#C6261A">JI&#x0300;T-THANG SALVAGE</text>
  <rect x="104" y="60" width="196" height="3" fill="#D9992A"/>
</svg>
