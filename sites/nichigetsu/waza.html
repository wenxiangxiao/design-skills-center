    var bx=cx, by=104, type=t[7];
    var arc='';
    if(type==='up'){bx=kx; by= primary==='mid'? top+96 : top+2; arc='<path d="M '+kx+' 116 L '+kx+' '+(by+16)+'" fill="none" stroke="#C22C5D" stroke-width="2.4" stroke-dasharray="3 5"/>';}
    else if(type==='swing'){bx=kx; by=top-40; arc='<path d="M 70 118 Q 96 30 '+kx+' '+(by+2)+'" fill="none" stroke="#C22C5D" stroke-width="2.4"/>';}
    else if(type==='arc'){bx=kx-46; by=top; arc='<path d="M '+(kx-46)+' '+top+' Q '+kx+' 8 '+(kx+46)+' '+top+'" fill="none" stroke="#C22C5D" stroke-width="2.4"/>';}
    else if(type==='round'){bx=kx; by=top-40; arc='<path d="M '+(kx-46)+' '+top+' Q '+(kx-30)+' 6 '+kx+' 14 Q '+(kx+34)+' 22 '+(kx+46)+' '+top+' Q '+(kx+20)+' '+(top-46)+' '+kx+' '+(by+2)+'" fill="none" stroke="#C22C5D" stroke-width="2.2"/>';}
    else if(type==='balance'){bx=kx; by=top-56; arc='';}
    s+=arc;
    s+='<circle cx="'+bx+'" cy="'+by+'" r="15" fill="#F2B227" stroke="#1E1410" stroke-width="2.6"/><circle cx="'+bx+'" cy="'+by+'" r="3.4" fill="#1E1410"/>';
    s+='</svg>';
    return s;
  }
  function stars(n){var s='';for(var i=0;i<5;i++)s+= i<n?'★':'☆';return s;}

  // ---- filters ----
  var cats=['のせ技','ふり技','一周技','バランス技','連続技'];
  var faces=['大皿','中皿','小皿','けん先'];
  var starF=[1,2,3,4,5];
  var sel={cat:null,face:null,star:null,q:''};
  function mkChips(host,arr,key,fmt){
    var h=document.getElementById(host);
    arr.forEach(function(v){
      var b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','false');
      b.textContent=fmt?fmt(v):v;
      b.addEventListener('click',function(){
        if(sel[key]===v){sel[key]=null;b.setAttribute('aria-pressed','false');}
        else{sel[key]=v;Array.prototype.forEach.call(h.children,function(x){x.setAttribute('aria-pressed','false');});b.setAttribute('aria-pressed','true');}
        render();
      });
      h.appendChild(b);
    });
  }
  mkChips('fcat',cats,'cat');
  mkChips('fface',faces,'face');
  mkChips('fstar',starF,'star',function(n){return stars(n);});
  document.getElementById('q').addEventListener('input',function(){sel.q=this.value.trim();render();});

  function render(){
    var list=document.getElementById('list'); list.innerHTML='';
    var n=0;
    TRICKS.forEach(function(t){
      if(sel.cat && t[3]!==sel.cat)return;
      if(sel.face && t[4].indexOf(sel.face)<0)return;
      if(sel.star && t[5]!==sel.star)return;
      if(sel.q){var hay=(t[1]+t[2]+t[3]+t[4].join('')).toLowerCase();if(hay.indexOf(sel.q.toLowerCase())<0)return;}
      n++;
      var c=document.createElement('article');c.className='tcard';
      var faceB=t[4].map(function(f){return '<span class="badge face">'+f+'</span>';}).join('');
      c.innerHTML='<div class="fig">'+drawFig(t)+'</div><div class="bd"><h3>'+t[2]+'</h3><div class="jp mono">'+t[1]+'</div>'+
        '<div class="meta"><span class="badge cat">'+t[3]+'</span>'+faceB+'<span class="star" title="難度'+t[5]+'">'+stars(t[5])+'</span></div>'+
        '<p>'+t[6]+'</p></div>';
      list.appendChild(c);
    });
    if(n===0){list.innerHTML='<div class="empty">沒有符合的技。放寬條件試試。</div>';}
    document.getElementById('count').textContent=n+' / '+TRICKS.length+' 式';
  }
  render();
})();
</script>
</body>
</html>
