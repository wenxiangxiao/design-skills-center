<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 128" width="320" height="128" role="img" aria-label="Kirkbraes 薔薇圃 KIRKBRAES ROSES">
  <title>Kirkbraes 薔薇圃 — KIRKBRAES ROSES</title>
  <defs>
    <marker id="kb-bead" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4.4" markerHeight="4.4" markerUnits="strokeWidth" orient="auto">
      <circle cx="4" cy="4" r="3.1" fill="#1A1714"/>
    </marker>
  </defs>
  <rect width="320" height="128" fill="#F1EFE8"/>
  <g fill="none" stroke="#1A1714" stroke-width="1.8">
    <!-- 兩根抽長的立桿，端點由 marker 收成珠 -->
    <line x1="26" y1="116" x2="26" y2="48" marker-start="url(#kb-bead)"/>
    <line x1="58" y1="116" x2="58" y2="74" marker-start="url(#kb-bead)"/>
    <!-- 格拉斯哥玫瑰：一個圓，內含四道交替方向的半弧，再切一道弦 -->
    <circle cx="26" cy="30" r="18"/>
    <path d="M 11.6 30 A 14.4 14.4 0 0 1 40.4 30"/>
    <path d="M 35.0 31.0 A 10.9 10.9 0 0 0 17.0 31.0"/>
    <path d="M 18.7 32.0 A 7.3 7.3 0 0 1 33.3 32.0"/>
    <path d="M 29.7 33.0 A 3.7 3.7 0 0 0 22.3 33.0"/>
    <path d="M 10.2 38.3 L 41.8 36.8" stroke-width="2.4"/>
  </g>
  <!-- 小方格陣：五格，恰有一格實心 -->
  <g stroke="#1A1714" stroke-width="1.2" fill="none">
    <rect x="52" y="34" width="7" height="7"/><rect x="52" y="45" width="7" height="7"/>
    <rect x="52" y="56" width="7" height="7"/><rect x="52" y="67" width="7" height="7"/>
  </g>
  <rect x="52" y="23" width="7" height="7" fill="#1A1714"/>
  <circle cx="26" cy="26.8" r="3.6" fill="#C4697E"/>
  <!-- 字：縱向抽長的等線體 -->
  <g font-family="Jost, Futura, 'Century Gothic', sans-serif" fill="#1A1714">
    <text x="88" y="62" font-size="15" font-weight="300" letter-spacing="7.4"
          transform="translate(88 62) scale(0.94 2.35) translate(-88 -62)">KIRKBRAES</text>
    <text x="88" y="92" font-size="10" font-weight="300" letter-spacing="8.6" fill="#9A968C">ROSES</text>
    <text x="180" y="92" font-size="10.5" font-weight="300" letter-spacing="5.2"
          font-family="'Noto Sans TC', sans-serif" fill="#9A968C">薔薇圃</text>
  </g>
  <line x1="88" y1="72" x2="296" y2="72" stroke="#1A1714" stroke-width="2"/>
</svg>
