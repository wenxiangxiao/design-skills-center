<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" role="img" aria-label="銅樞開鎖研習所 剖鎖標記">
  <defs>
    <clipPath id="plugClip"><circle cx="70" cy="74" r="34"/></clipPath>
  </defs>
  <!-- shell body -->
  <rect x="8" y="40" width="124" height="72" rx="6" fill="#4A4D41" stroke="#14150F" stroke-width="3"/>
  <!-- section hatching on shell (cut metal) -->
  <g stroke="#3E4137" stroke-width="1.4" opacity="0.7">
    <line x1="14" y1="46" x2="26" y2="58"/><line x1="14" y1="58" x2="26" y2="70"/>
    <line x1="114" y1="46" x2="126" y2="58"/><line x1="114" y1="58" x2="126" y2="70"/>
  </g>
  <!-- shear line -->
  <line x1="8" y1="74" x2="132" y2="74" stroke="#C79A3E" stroke-width="2.4" stroke-dasharray="7 4"/>
  <!-- plug -->
  <circle cx="70" cy="74" r="34" fill="#2E5A6E" stroke="#14150F" stroke-width="3"/>
  <!-- keyway -->
  <path d="M70 60 L66 66 L69 70 L64 80 L70 92 L76 80 L71 70 L74 66 Z" fill="#14150F"/>
  <!-- pin chambers (five): springs + driver(steel) + key(brass) at shear line -->
  <g clip-path="url(#plugClip)"></g>
  <g stroke="#14150F" stroke-width="2">
    <!-- chamber walls + pins, from left to right -->
    <g transform="translate(34,0)">
      <rect x="-4" y="18" width="8" height="24" fill="#3A6076"/>
      <rect x="-4" y="58" width="8" height="14" fill="#C79A3E"/>
      <path d="M-4 12 q4 3 8 0 q-4 3 8 0" fill="none" stroke="#8A8E7C" stroke-width="1.6"/>
    </g>
    <g transform="translate(52,0)">
      <rect x="-4" y="22" width="8" height="20" fill="#3A6076"/>
      <rect x="-4" y="54" width="8" height="18" fill="#C79A3E"/>
    </g>
    <g transform="translate(70,0)">
      <rect x="-4" y="16" width="8" height="26" fill="#3A6076"/>
      <rect x="-4" y="60" width="8" height="12" fill="#C79A3E"/>
    </g>
    <g transform="translate(88,0)">
      <rect x="-4" y="24" width="8" height="18" fill="#3A6076"/>
      <rect x="-4" y="52" width="8" height="20" fill="#C79A3E"/>
    </g>
    <g transform="translate(106,0)">
      <rect x="-4" y="20" width="8" height="22" fill="#3A6076"/>
      <rect x="-4" y="56" width="8" height="16" fill="#C79A3E"/>
    </g>
  </g>
  <!-- tension wrench hint -->
  <path d="M64 96 L58 108 L84 108" fill="none" stroke="#E4602B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
