<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-label="向陽蜂學所——巢脾上的搖擺舞徽記">
  <!-- Observation-Hive logo: hex-comb cluster + figure-eight waggle path + a scout bee on the waggle run.
       All primitives are the same ones the site engine uses. -->
  <defs>
    <clipPath id="lgc"><rect x="0" y="0" width="132" height="132" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#lgc)">
    <rect width="132" height="132" fill="#1B1408"/>
    <!-- honeycomb of pointy-top hexes -->
    <g stroke="#140E06" stroke-width="2" stroke-linejoin="round">
      <polygon points="66,20 84,31 84,53 66,64 48,53 48,31" fill="#241A0C"/>
      <polygon points="48,53 66,64 66,86 48,97 30,86 30,64" fill="#E8A63C"/>
      <polygon points="84,53 102,64 102,86 84,97 66,86 66,64" fill="#241A0C"/>
      <polygon points="66,86 84,97 84,119 66,130 48,119 48,97" fill="#241A0C"/>
    </g>
    <!-- capped-honey cell marker on the amber cell -->
    <circle cx="48" cy="75" r="4.6" fill="#F2C74B" stroke="#140E06" stroke-width="1.6"/>
    <!-- figure-eight dance path: two return loops + a straight waggle run through the middle -->
    <g fill="none" stroke="#EFE0BE" stroke-width="2.4" stroke-linecap="round">
      <path d="M66 92 C 40 84, 40 58, 60 50" opacity="0.72"/>
      <path d="M66 92 C 92 84, 92 58, 72 50" opacity="0.72"/>
    </g>
    <!-- waggle run (the message), tilted; drawn thicker in pollen gold -->
    <line x1="66" y1="94" x2="72" y2="46" stroke="#F2C74B" stroke-width="3.4" stroke-linecap="round"/>
    <!-- scout bee on the run -->
    <g transform="translate(69,70) rotate(7)">
      <ellipse cx="0" cy="0" rx="6.2" ry="9.2" fill="#E8A63C" stroke="#140E06" stroke-width="1.8"/>
      <path d="M-6 -3 H6 M-6 1.5 H6 M-6 6 H6" stroke="#140E06" stroke-width="1.8"/>
      <circle cx="0" cy="-11" r="3.4" fill="#241A0C" stroke="#140E06" stroke-width="1.6"/>
      <ellipse cx="-7" cy="-6" rx="4.4" ry="2.4" fill="#EFE0BE" opacity="0.82" stroke="#140E06" stroke-width="1" transform="rotate(-32 -7 -6)"/>
      <ellipse cx="7" cy="-6" rx="4.4" ry="2.4" fill="#EFE0BE" opacity="0.82" stroke="#140E06" stroke-width="1" transform="rotate(32 7 -6)"/>
    </g>
  </g>
  <rect x="1" y="1" width="130" height="130" rx="4" fill="none" stroke="#C9A15E" stroke-width="2"/>
</svg>
