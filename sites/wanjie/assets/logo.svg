<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 44" role="img" aria-label="綰結所 WǍNJIÉ">
  <!-- logo mark: a reef-knot crossing diagram rendered as laid cord -->
  <g transform="translate(4,2)">
    <!-- under strand (denim), broken where the over strand passes -->
    <path d="M2 20 C10 8 20 8 26 18" fill="none" stroke="#8FA3AB" stroke-width="7" stroke-linecap="round"/>
    <path d="M14 30 C20 40 30 40 38 28" fill="none" stroke="#8FA3AB" stroke-width="7" stroke-linecap="round"/>
    <!-- over strand (clay) -->
    <path d="M2 28 C10 40 22 40 30 26 C34 19 30 14 24 18 C18 22 22 14 30 10 C36 7 40 12 38 20" fill="none" stroke="#C67C58" stroke-width="7" stroke-linecap="round"/>
    <!-- core highlights (the "lay" of the rope) -->
    <path d="M2 28 C10 40 22 40 30 26 C34 19 30 14 24 18 C18 22 22 14 30 10 C36 7 40 12 38 20" fill="none" stroke="#E9E1CF" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
  </g>
  <g fill="#3A362E" font-family="'Fraunces','Noto Serif TC',serif" font-weight="700">
    <text x="52" y="24" font-size="20" letter-spacing="1">綰結所</text>
    <text x="52" y="39" font-family="'IBM Plex Mono',monospace" font-size="9" letter-spacing="3" fill="#6f6a5d">WANJIE · KNOT STUDIO</text>
  </g>
</svg>
