<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" role="img" aria-label="北窗豆腐 PAK-THANG 標誌：同色的豆腐塊，左上壓著一扇四格窗">
  <defs>
    <filter id="up" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="6" stdDeviation="6" flood-color="#BCB3A3"/>
      <feDropShadow dx="-6" dy="-6" stdDeviation="6" flood-color="#FFFDF8"/>
    </filter>
    <filter id="down" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="2" dy="2" in="SourceAlpha" result="o"/><feGaussianBlur in="o" stdDeviation="1.6" result="b"/>
      <feComposite in="SourceAlpha" in2="b" operator="out" result="ring"/><feFlood flood-color="#A79E8E"/><feComposite in2="ring" operator="in" result="dark"/>
      <feOffset dx="-2" dy="-2" in="SourceAlpha" result="o2"/><feGaussianBlur in="o2" stdDeviation="1.6" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="ring2"/><feFlood flood-color="#FFFDF8"/><feComposite in2="ring2" operator="in" result="lite"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="lite"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="140" rx="28" fill="#E6E1D6"/>
  <rect x="22" y="22" width="96" height="96" rx="24" fill="#E6E1D6" filter="url(#up)"/>
  <g filter="url(#down)" fill="#E6E1D6">
    <rect x="36" y="36" width="15" height="15" rx="4"/><rect x="54" y="36" width="15" height="15" rx="4"/>
    <rect x="36" y="54" width="15" height="15" rx="4"/><rect x="54" y="54" width="15" height="15" rx="4"/>
  </g>
  <circle cx="98" cy="98" r="5" fill="#3A8F53"/>
  <text x="146" y="78" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="40" font-weight="900" letter-spacing="4" fill="#3B352D">北窗豆腐</text>
  <text x="148" y="106" font-family="Nunito,'Helvetica Neue',sans-serif" font-size="15" font-weight="800" letter-spacing="5" fill="#716A5E">PAK-THANG · 1971</text>
</svg>
