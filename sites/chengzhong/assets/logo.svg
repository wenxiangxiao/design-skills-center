<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="城中電話交換所">
  <!-- bakelite roundel plate -->
  <circle cx="60" cy="60" r="56" fill="#6E1D22"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#201613" stroke-width="3"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#C7A24A" stroke-width="1.5" stroke-dasharray="2 4"/>
  <!-- the jack: brass ring set into an ivory bezel -->
  <circle cx="60" cy="60" r="26" fill="#E7DCC4"/>
  <circle cx="60" cy="60" r="26" fill="none" stroke="#201613" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="14" fill="#201613"/>
  <circle cx="60" cy="60" r="14" fill="none" stroke="#C7A24A" stroke-width="2.5"/>
  <!-- plug tip seated in the jack -->
  <circle cx="60" cy="60" r="5.5" fill="#C7A24A"/>
  <circle cx="60" cy="60" r="5.5" fill="none" stroke="#201613" stroke-width="1.4"/>
  <!-- patch cord curling out, forming a C -->
  <path d="M60 74 C 60 96, 30 100, 22 82 C 16 68, 30 58, 40 64"
        fill="none" stroke="#201613" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 74 C 60 96, 30 100, 22 82 C 16 68, 30 58, 40 64"
        fill="none" stroke="#C7A24A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- calling lamp -->
  <circle cx="60" cy="26" r="4.5" fill="#E8A33D"/>
  <circle cx="60" cy="26" r="4.5" fill="none" stroke="#201613" stroke-width="1.4"/>
</svg>
