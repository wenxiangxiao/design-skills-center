<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="日新瓦斯行">
  <title>日新瓦斯行</title>
  <desc>六格連環窗的縮影：五格墨版、一格朱紅版，框仔頂懸四个缺口是型版的橋。</desc>
  <rect width="320" height="96" fill="#C4B896"/>
  <!-- 窗框（墨版）與四塊玻璃的橋 -->
  <g fill="#17150F">
    <rect x="10" y="10" width="76" height="76"/>
  </g>
  <g fill="#C4B896">
    <rect x="18" y="18" width="28" height="28"/><rect x="50" y="18" width="28" height="28"/>
    <rect x="18" y="50" width="28" height="28"/>
    <!-- 橋：四條缺口，予每一塊玻璃攏透去外口 -->
    <rect x="28" y="6" width="8" height="16"/><rect x="60" y="6" width="8" height="16"/>
    <rect x="28" y="74" width="8" height="16"/><rect x="6" y="28" width="16" height="8"/>
  </g>
  <!-- 第四塊玻璃：朱紅版（今仔日彼格）＋伊自己的橋 -->
  <g fill="#D0301E" style="mix-blend-mode:multiply">
    <rect x="51.5" y="51.5" width="28" height="28"/>
    <rect x="79" y="60" width="15" height="8"/>
  </g>
  <!-- 店號 -->
  <g fill="#17150F">
    <rect x="100" y="10" width="6" height="76"/>
  </g>
  <text x="118" y="52" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-weight="900"
        font-size="38" letter-spacing="6" fill="#17150F">日新</text>
  <text x="118" y="80" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-weight="900"
        font-size="21" letter-spacing="5" fill="#D0301E" style="mix-blend-mode:multiply">瓦斯行</text>
  <text x="209" y="80" font-family="'Saira Stencil One',Impact,sans-serif"
        font-size="14" letter-spacing="2" fill="#17150F">JI'T-SIN GAS</text>
  <rect x="118" y="20" width="150" height="5" fill="#17150F"/>
</svg>
