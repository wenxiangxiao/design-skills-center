  <rect width="360" height="120" fill="#E6E3DB"/>
  <!-- 渦：偏心，九個角寬全不相同的楔。中心那個 5px 方塊是渦心本身——它不動 -->
  <g>
    <polygon points="40,70 118,8 118,26" fill="#0E0F12"/>
    <polygon points="40,70 118,26 118,42" fill="#BE3A52"/>
    <polygon points="40,70 118,42 118,68" fill="#0E0F12"/>
    <polygon points="40,70 118,68 98,118" fill="#7FA79B"/>
    <polygon points="40,70 98,118 38,118" fill="#0E0F12"/>
    <polygon points="40,70 38,118 0,90" fill="#8C9298"/>
    <polygon points="40,70 0,90 0,16" fill="#0E0F12"/>
    <polygon points="40,70 0,16 62,2" fill="#BE3A52"/>
    <polygon points="40,70 62,2 118,8" fill="#E6E3DB"/>
    <rect x="37" y="67" width="6" height="6" fill="#E6E3DB"/>
