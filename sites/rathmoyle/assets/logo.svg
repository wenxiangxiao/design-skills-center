<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="RATHMOYLE DEALG：開口銀環與長針">
  <title>RATHMOYLE DEALG</title>
  <desc>環形胸針（penannular）：一個開口的環，環上一根可轉的長針。環面為交織帶，開口兩端收獸首。</desc>
  <rect width="220" height="220" fill="#E8DCC0"/>
  <!-- 環：墨廓 + 雌黃帶面。缺口在上方（penannular 的定義） -->
  <path d="M110 34a76 76 0 1 0 53.7 22.3" fill="none" stroke="#23190F" stroke-width="34" stroke-linecap="butt"/>
  <path d="M110 34a76 76 0 1 0 53.7 22.3" fill="none" stroke="#DFA61C" stroke-width="24" stroke-linecap="butt"/>
  <!-- 環面上的交織：四道下穿的缺口（在下的帶子退開，讓上面那條的墨廓穿過） -->
  <g stroke="#23190F" stroke-width="26" fill="none" stroke-linecap="butt">
    <path d="M52.6 60.1l14.8 14.8"/><path d="M40.5 141.6l19.6-8.1"/>
    <path d="M110.5 186l0-21"/><path d="M174 122.6l-20.8-4.6"/>
  </g>
  <g stroke="#37735D" stroke-width="18" fill="none" stroke-linecap="butt">
    <path d="M52.6 60.1l14.8 14.8"/><path d="M40.5 141.6l19.6-8.1"/>
    <path d="M110.5 186l0-21"/><path d="M174 122.6l-20.8-4.6"/>
  </g>
  <!-- 開口兩端的獸首：帶端長出頭來 -->
  <g fill="#DFA61C" stroke="#23190F" stroke-width="4" stroke-linejoin="round">
    <path d="M110 17q13 0 19 8l7 9-9 5 9 5-7 9q-6 8-19 8Z"/>
    <path d="M178 46q9 9 11 20l2 11-10-2 6 9-10 6q-10 5-19-2Z"/>
  </g>
  <circle cx="124" cy="31" r="3.6" fill="#23190F"/>
  <circle cx="181" cy="61" r="3.6" fill="#23190F"/>
  <!-- 長針：穿過環、可在環上轉 -->
  <path d="M44 198L168 46" stroke="#23190F" stroke-width="15" stroke-linecap="round"/>
  <path d="M44 198L168 46" stroke="#C04A28" stroke-width="6" stroke-linecap="round"/>
  <circle cx="168" cy="46" r="10" fill="#23190F"/>
  <circle cx="171" cy="43" r="3" fill="#E8DCC0"/>
  <!-- 朱點輪廓：母題外圍一圈單顆鉛丹點 -->
  <g fill="#C04A28">
    <circle cx="110" cy="10" r="3"/><circle cx="145" cy="17" r="3"/><circle cx="176" cy="36" r="3"/>
    <circle cx="199" cy="66" r="3"/><circle cx="210" cy="103" r="3"/><circle cx="206" cy="141" r="3"/>
    <circle cx="188" cy="174" r="3"/><circle cx="159" cy="198" r="3"/><circle cx="122" cy="209" r="3"/>
    <circle cx="84" cy="207" r="3"/><circle cx="50" cy="192" r="3"/><circle cx="24" cy="165" r="3"/>
    <circle cx="11" cy="130" r="3"/><circle cx="11" cy="92" r="3"/><circle cx="25" cy="57" r="3"/>
    <circle cx="52" cy="29" r="3"/><circle cx="85" cy="13" r="3"/>
  </g>
</svg>
