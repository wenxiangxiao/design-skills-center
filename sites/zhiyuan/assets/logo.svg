<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="九降紙鳶所徽記">
  <rect width="64" height="64" fill="#5C7885"/>
  <!-- wind streaks -->
  <path d="M6 15 h16 M4 22 h11 M8 51 h13 M6 44 h9" stroke="#88A0AD" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- kite: diamond with cross spar -->
  <g stroke="#182226" stroke-width="2.4" stroke-linejoin="round">
    <polygon points="38,10 52,29 38,34 24,29" fill="#E14B2A"/>
    <polygon points="38,34 52,29 38,52 24,29" fill="#E7A92E"/>
    <line x1="38" y1="10" x2="38" y2="52" stroke-width="1.8"/>
    <line x1="24" y1="29" x2="52" y2="29" stroke-width="1.8"/>
  </g>
  <!-- flying line to lower-left hand + tail -->
  <path d="M38 52 C 30 55 22 54 12 58" stroke="#182226" stroke-width="1.6" fill="none"/>
  <path d="M38 52 q -3 6 2 9 q 5 3 1 8" stroke="#274A6B" stroke-width="1.6" fill="none"/>
  <circle cx="12" cy="58" r="2.4" fill="#182226"/>
</svg>
