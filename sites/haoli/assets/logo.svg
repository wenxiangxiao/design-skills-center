  <rect x="8" y="10" width="150" height="12" fill="#14161A"/>
  <rect x="58" y="14" width="1" height="96" fill="#C99B4A" opacity=".7"/>
  <rect x="108" y="14" width="1" height="96" fill="#C99B4A" opacity=".7"/>
  <text x="61" y="21" font-size="8" font-family="monospace" fill="#C99B4A">10.9</text>
  <!-- 狹縫掃描出的跑者：軀幹厚帶＋波浪肢帶 -->
  <path d="M52 44 h34 v20 h-34 z" fill="#E7E2D6"/>
  <path d="M56 32 h12 v9 h-12 z" fill="#CFC9BB"/>
  <path d="M40 70 q8 -9 16 0 t16 0 t16 0 t16 0" stroke="#AFAA9D" stroke-width="7" fill="none"/>
