<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" width="240" height="72" role="img" aria-label="暗班編輯室">
  <title>暗班編輯室 AM-PAN</title>
  <defs>
    <filter id="tonerL" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feMorphology operator="dilate" radius="0.7"/>
      <feMorphology operator="erode" radius="0.5"/>
      <feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
  </defs>
  <!-- 紙：右緣與下緣為二值化後的階梯狀崩邊 -->
  <path fill="#FFFFFF" stroke="#16130F" stroke-width="2" filter="url(#tonerL)"
    d="M6 6 H150 V13 H154 V20 H150 V31 H155 V44 H151 V56 H146 V62 H92 V58 H60 V63 H24 V57 H10 V44 H6 Z"/>
  <!-- 摺角：紙背 -->
  <path fill="#B9B4AC" d="M150 6 L150 26 L128 6 Z"/>
  <path fill="none" stroke="#16130F" stroke-width="2.4" d="M150 26 L128 6"/>
  <!-- 三條字行：實心碳粉條 -->
  <rect x="20" y="22" width="86" height="7" fill="#16130F"/>
  <rect x="20" y="35" width="104" height="7" fill="#16130F"/>
  <rect x="20" y="48" width="62" height="7" fill="#16130F"/>
  <!-- 馬克筆圈記：單筆、不閉合、壓在紙上 -->
  <path fill="none" stroke="#FF3B00" stroke-width="5" stroke-linecap="butt"
    d="M14 40 C10 27, 44 17, 88 20 C126 23, 138 33, 132 42 C126 51, 84 58, 44 55 C24 53, 15 48, 17 42"/>
  <!-- 裁切角規 -->
  <path fill="none" stroke="#16130F" stroke-width="2" d="M170 8 H196 M182 2 V26"/>
  <path fill="none" stroke="#16130F" stroke-width="2" d="M170 64 H196 M182 46 V70"/>
  <rect x="204" y="18" width="30" height="30" fill="#16130F"/>
  <rect x="211" y="25" width="16" height="16" fill="#FF3B00"/>
</svg>
