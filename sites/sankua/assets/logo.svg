<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="三刮印房 SANKUA：網框與刮刀，粉版故意套歪。">
  <title>三刮印房 SANKUA</title>
  <defs>
    <pattern id="gauze" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0h5M0 0v5" stroke="#141118" stroke-width=".7" opacity=".55"/>
    </pattern>
  </defs>
  <!-- RUN 02 螢光粉：套不準的那一版 -->
  <g transform="translate(3.4 -2.6)" fill="#FF2D6F">
    <rect x="12" y="14" width="126" height="62"/>
    <path d="M6 86h138l-13 22H19z"/>
  </g>
  <!-- RUN 01 黑版：基準版 -->
  <g fill="none" stroke="#141118">
    <rect x="12" y="14" width="126" height="62" stroke-width="6"/>
    <rect x="12" y="14" width="126" height="62" fill="url(#gauze)" stroke="none"/>
    <path d="M6 86h138l-13 22H19z" stroke-width="6" stroke-linejoin="round"/>
    <path d="M2 82h146" stroke-width="7"/>
  </g>
  <text x="166" y="56" font-family="Archivo Black, Helvetica, sans-serif" font-size="40" fill="#141118">SAN</text>
  <text x="166" y="98" font-family="Archivo Black, Helvetica, sans-serif" font-size="40" fill="#1F3FC4">KUA</text>
  <text x="166" y="112" font-family="Archivo Narrow, Helvetica, sans-serif" font-size="10" letter-spacing="3.2" fill="#141118">SCREENPRINT &amp; SKATE</text>
</svg>
