<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 132" width="460" height="132" role="img" aria-label="輪班 SHIFT — 北門單車快遞合作社">
  <title>輪班 SHIFT — 北門單車快遞合作社</title>
  <desc>螢光橘紙上一色影印黑：左為型版鏤空的「輪班」二字，右為一張攤平的八格落版紙，右下角摺起一角。</desc>
  <rect width="460" height="132" fill="#FF5A1F"/>

  <!-- 型版鏤空字：所有筆畫都是實心色塊，被型版橋斷開 -->
  <g fill="#121110">
    <rect x="14" y="20" width="96" height="76"/>
    <rect x="120" y="20" width="96" height="76"/>
  </g>
  <g fill="#FF5A1F">
    <rect x="26" y="34" width="72" height="10"/>
    <rect x="26" y="52" width="30" height="10"/><rect x="62" y="52" width="36" height="10"/>
    <rect x="26" y="70" width="72" height="10"/>
    <rect x="52" y="34" width="10" height="46"/>
    <rect x="132" y="34" width="26" height="10"/><rect x="164" y="34" width="40" height="10"/>
    <rect x="132" y="52" width="72" height="10"/>
    <rect x="132" y="70" width="32" height="10"/><rect x="172" y="70" width="32" height="10"/>
    <rect x="158" y="34" width="10" height="46"/>
  </g>

  <!-- 拉丁刊名與識別行：全部實心，沒有一條細線 -->
  <text x="232" y="48" font-family="Archivo Black, Helvetica, sans-serif" font-size="30" fill="#121110">SHIFT</text>
  <rect x="232" y="56" width="120" height="5" fill="#121110"/>
  <text x="232" y="78" font-family="Courier New, monospace" font-weight="700" font-size="13" fill="#121110">BEIMEN COURIER CO-OP</text>
  <text x="232" y="96" font-family="Courier New, monospace" font-weight="700" font-size="12" fill="#121110">ONE SHEET / EIGHT PAGES</text>
  <text x="232" y="114" font-family="Courier New, monospace" font-size="11.5" fill="#121110">FREE TO COPY. DON'T SELL IT.</text>

  <!-- 落版紙：四欄兩列、中間兩格的橫線被剪開（實線＝剪，虛線＝摺） -->
  <g transform="translate(366,26)">
    <rect x="0" y="0" width="80" height="80" fill="#EFEDE6" stroke="#121110" stroke-width="4"/>
    <path d="M20 0v80M60 0v80" stroke="#121110" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
    <path d="M40 0v80" stroke="#121110" stroke-width="3" stroke-dasharray="5 5" fill="none"/>
    <path d="M0 40h20M60 40h20" stroke="#121110" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
    <path d="M20 40h40" stroke="#121110" stroke-width="5" fill="none"/>
    <path d="M80 80l-22 0 22-22z" fill="#FF5A1F"/>
    <path d="M80 80l-22 0 22-22" fill="none" stroke="#121110" stroke-width="4"/>
  </g>
</svg>
